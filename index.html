
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>ドット勇者の冒険</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#101827;color:white;font-family:monospace;touch-action:manipulation}
button{font:inherit;color:white;border:2px solid #73839b;background:#253653;border-radius:7px;min-height:34px;cursor:pointer}
button:active{background:#5274a0}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 7px env(safe-area-inset-bottom)}
header{flex:none;text-align:center;font-weight:bold;font-size:15px;padding:4px}
#stats{flex:none;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;font-size:11px;text-align:center}
.stat{background:#24334a;border:1px solid #536580;border-radius:4px;padding:4px 1px}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
.view.active{display:flex}
#mapArea{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:4px}
#map{height:100%;width:100%;max-width:100%;object-fit:contain;image-rendering:pixelated}
#mapControls{flex:none;display:flex;justify-content:space-between;align-items:center;gap:5px;padding:3px}
#dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,37px);gap:2px}
#dpad button{font-size:19px;touch-action:none}
#sideButtons{display:grid;grid-template-columns:repeat(2,minmax(60px,1fr));gap:5px;flex:1;max-width:210px}
#sideButtons button{font-size:12px}
#message{flex:none;background:#182338;border:1px solid #63758c;border-radius:5px;padding:6px;min-height:31px;max-height:45px;overflow:hidden;font-size:11px;line-height:1.4}
#battleArt{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#283047,#080d19 75%);border:2px solid #56657c;border-radius:6px;margin:4px 0;overflow:hidden}
#enemyImage{max-width:90%;max-height:90%;object-fit:contain;image-rendering:pixelated}
#enemyFallback{display:none;width:min(58vw,190px);height:min(58vw,190px);image-rendering:pixelated}
#enemyInfo{text-align:center;font-size:13px;padding:3px}
#battleLog{flex:none;min-height:45px;max-height:65px;overflow:hidden;font-size:12px;background:#182338;padding:6px;border:1px solid #56657c;border-radius:5px}
#battleCommands{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px 0}
#battleCommands button{min-height:42px}
#panel{display:none;position:absolute;inset:env(safe-area-inset-top) 7px env(safe-area-inset-bottom);z-index:10;background:#111c30;border:2px solid #8093b3;border-radius:9px;padding:10px;overflow:auto}
#panel h3{margin:3px 0 9px}
#panelContent{display:flex;flex-direction:column;gap:6px;font-size:13px}
#panelContent button{text-align:left;padding:9px}
#closePanel{width:100%;margin-top:12px}
.small{font-size:11px;color:#c5d4eb}
@media(max-height:690px){
header{font-size:12px;padding:2px}
.stat{padding:2px}
#dpad{grid-template-columns:repeat(3,39px);grid-template-rows:repeat(3,32px)}
#mapControls{padding:1px}
#battleCommands button{min-height:34px}
#battleLog{min-height:37px;max-height:45px}
#enemyInfo{padding:1px}
}
</style>
</head>
<body>
<div id="app">
<header>⚔ ドット勇者の冒険</header>
<div id="stats">
<div class="stat" id="levelStat"></div>
<div class="stat" id="hpStat"></div>
<div class="stat" id="mpStat"></div>
<div class="stat" id="goldStat"></div>
<div class="stat" id="atkStat"></div>
<div class="stat" id="defStat"></div>
</div>
<div id="screen">
<section id="fieldView" class="view active">
<div id="mapArea"><canvas id="map" width="320" height="320"></canvas></div>
<div id="mapControls">
<div id="dpad">
<span></span><button data-dir="0,-1">▲</button><span></span>
<button data-dir="-1,0">◀</button><button onclick="openStatus()">●</button><button data-dir="1,0">▶</button>
<span></span><button data-dir="0,1">▼</button><span></span>
</div>
<div id="sideButtons">
<button onclick="openShop()">🏪 お店</button>
<button onclick="openItems()">🎒 道具</button>
<button onclick="openEquipment()">🛡 装備</button>
<button onclick="openStatus()">📜 状態</button>
</div>
</div>
<div id="message">冒険が始まった！</div>
</section>
<section id="battleView" class="view">
<div id="enemyInfo"></div>
<div id="battleArt">
<img id="enemyImage" alt="敵">
<canvas id="enemyFallback" width="128" height="128"></canvas>
</div>
<div id="battleLog">敵が現れた！</div>
<div id="battleCommands">
<button onclick="attack()">⚔ 攻撃</button>
<button onclick="defend()">🛡 防御</button>
<button onclick="openMagic()">🔥 魔法・技</button>
<button onclick="escapeBattle()">🏃 逃げる</button>
<button onclick="openItems()">🌿 道具</button>
<button onclick="openStatus()">📜 状態</button>
</div>
</section>
</div>
</div>
<div id="panel">
<h3 id="panelTitle"></h3>
<div id="panelContent"></div>
<button id="closePanel" onclick="closePanel()">戻る</button>
</div>
<script>
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MAPSIZE=10;
const names=["草原","砂漠","毒沼"];
const enemyTables=[
[
{name:"スライム",hp:20,atk:5,def:1,xp:7,gold:8,img:"slime.png",type:"slime"},
{name:"ゴブリン",hp:32,atk:8,def:3,xp:13,gold:15,img:"goblin.png",type:"goblin"}
],
[
{name:"ゾンビ",hp:65,atk:16,def:7,xp:30,gold:35,type:"zombie"},
{name:"さそり",hp:52,atk:19,def:9,xp:35,gold:40,type:"scorpion"}
],
[
{name:"兵士",hp:105,atk:28,def:16,xp:65,gold:70,type:"soldier"},
{name:"悪魔",hp:130,atk:35,def:19,xp:85,gold:90,type:"demon"}
]
];
const bosses=[
{name:"ドラゴン",hp:160,atk:23,def:11,xp:110,gold:140,img:"dragon.png",type:"dragon"},
{name:"ゴーレム",hp:320,atk:38,def:25,xp:260,gold:330,type:"golem"},
{name:"魔王",hp:600,atk:55,def:32,xp:650,gold:1000,type:"demon"}
];
const tiers=[
{name:"銅",price:40,atk:4,shield:2,armor:3},
{name:"鉄",price:160,atk:10,shield:5,armor:8},
{name:"鋼",price:480,atk:22,shield:11,armor:16}
];
const skills=[
{name:"チカラ切り",lv:3,mp:1,mult:1.5,kind:"skill"},
{name:"渾身切り",lv:6,mp:3,mult:2,kind:"skill"},
{name:"本気切り",lv:10,mp:5,mult:3,kind:"skill"},
{name:"火炎弾",lv:2,mp:2,min:10,max:20,kind:"magic"},
{name:"爆炎弾",lv:5,mp:5,min:25,max:50,kind:"magic"},
{name:"豪炎弾",lv:8,mp:10,min:50,max:80,kind:"magic"}
];
const initial=()=>({
lv:1,xp:0,gold:30,
hp:50,maxHp:50,mp:12,maxMp:12,
atk:9,def:3,area:0,x:1,y:8,
owned:[],equipment:{sword:-1,shield:-1,armor:-1},
items:{herb:3,water:2},cleared:[false,false,false]
});
let player=initial();
try{
const saved=JSON.parse(localStorage.getItem("dotRPGSave"));
if(saved&&saved.lv&&saved.equipment)player=saved;
}catch(e){}
let enemy=null;
let defending=false;
let busy=false;
let battleBoss=false;
let gameWon=false;
function save(){
try{localStorage.setItem("dotRPGSave",JSON.stringify(player));}catch(e){}
}
function totalAtk(){
return player.atk+(player.equipment.sword<0?0:tiers[player.equipment.sword].atk);
}
function totalDef(){
return player.def+
(player.equipment.shield<0?0:tiers[player.equipment.shield].shield)+
(player.equipment.armor<0?0:tiers[player.equipment.armor].armor);
}
function refresh(){
$("levelStat").textContent="LV "+player.lv+" / "+names[player.area];
$("hpStat").textContent="HP "+player.hp+"/"+player.maxHp;
$("mpStat").textContent="MP "+player.mp+"/"+player.maxMp;
$("goldStat").textContent="💰 "+player.gold+"G";
$("atkStat").textContent="攻撃 "+totalAtk();
$("defStat").textContent="守備 "+totalDef();
save();
}
function msg(t){$("message").textContent=t;}
function showView(v){
$("fieldView").classList.toggle("active",v==="field");
$("battleView").classList.toggle("active",v==="battle");
}
function closePanel(){$("panel").style.display="none";}
function panel(title,items){
$("panelTitle").textContent=title;
const box=$("panelContent");box.innerHTML="";
items.forEach(it=>{
if(typeof it==="string"){
const p=document.createElement("div");p.textContent=it;box.appendChild(p);
}else{
const b=document.createElement("button");
b.textContent=it.text;
b.onclick=it.fn;box.appendChild(b);
}
});
$("panel").style.display="block";
}
const canvas=$("map"),ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
function tile(x,y,color){
ctx.fillStyle=color;ctx.fillRect(x*32,y*32,32,32);
}
function drawMap(){
const area=player.area;
const colors=["#6eae58","#d6b66b","#665276"];
const detail=["#4d8d42","#b9944c","#49365a"];
for(let y=0;y<10;y++)for(let x=0;x<10;x++){
tile(x,y,colors[area]);
ctx.fillStyle=detail[area];
let seed=(x*31+y*17+x*y*7)%9;
if(seed<3){
ctx.fillRect(x*32+6,y*32+10,3,7);
ctx.fillRect(x*32+19,y*32+22,5,3);
}
if(x===0||y===0||x===9||y===9){
ctx.fillStyle=area===0?"#376f39":area===1?"#a98643":"#332849";
ctx.fillRect(x*32,y*32,32,32);
}
}
if(area===0){
for(let i=0;i<9;i++){
const x=(i*3+2)%8+1,y=(i*7+3)%8+1;
if(x===player.x&&y===player.y)continue;
ctx.fillStyle="#275f35";
ctx.fillRect(x*32+6,y*32+5,20,19);
ctx.fillStyle="#7c4b2a";
ctx.fillRect(x*32+13,y*32+22,6,8);
}
}
if(area===1){
for(let i=0;i<8;i++){
let x=(i*5+3)%8+1,y=(i*3+2)%8+1;
ctx.fillStyle="#9d7b3e";
ctx.fillRect(x*32+12,y*32+9,8,20);
}
}
if(area===2){
for(let i=0;i<8;i++){
let x=(i*5+2)%8+1,y=(i*3+4)%8+1;
ctx.fillStyle="#864ca1";
ctx.fillRect(x*32+3,y*32+12,26,12);
}
}
drawSymbol(1,1,"🏪");
if(!player.cleared[area])drawSymbol(8,1,["🐉","🗿","👿"][area]);
if(player.cleared[area]&&area<2)drawSymbol(8,8,"🚪");
drawHero(player.x,player.y);
}
function drawSymbol(x,y,s){
ctx.font="25px sans-serif";ctx.textAlign="center";
ctx.fillText(s,x*32+16,y*32+26);
}
function drawHero(x,y){
const px=x*32,py=y*32;
ctx.fillStyle="#e7c18c";ctx.fillRect(px+12,py+7,9,8);
ctx.fillStyle="#5c3b29";ctx.fillRect(px+10,py+4,13,5);
ctx.fillStyle="#2864ce";ctx.fillRect(px+9,py+15,15,11);
ctx.fillStyle="#d6dbe9";ctx.fillRect(px+7,py+17,3,9);
ctx.fillStyle="#282b40";
ctx.fillRect(px+10,py+26,5,5);ctx.fillRect(px+19,py+26,5,5);
}
function move(dx,dy){
if(enemy||$("panel").style.display==="block")return;
const x=player.x+dx,y=player.y+dy;
if(x<1||y<1||x>8||y>8)return;
player.x=x;player.y=y;
if(x===1&&y===1){drawMap();openShop();return;}
if(x===8&&y===1&&!player.cleared[player.area]){
drawMap();startBattle(bosses[player.area],true);return;
}
if(x===8&&y===8&&player.cleared[player.area]&&player.area<2){
player.area++;player.x=1;player.y=8;
msg(names[player.area]+"に到着した！");refresh();drawMap();return;
}
if(Math.random()<0.13){
const list=enemyTables[player.area];
startBattle(list[rand(0,list.length-1)],false);
}else{msg(names[player.area]+"を探索している。");}
drawMap();refresh();
}
document.querySelectorAll("[data-dir]").forEach(b=>{
const [dx,dy]=b.dataset.dir.split(",").map(Number);
b.addEventListener("click",()=>move(dx,dy));
});
document.addEventListener("keydown",e=>{
const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
if(dirs[e.key]){e.preventDefault();move(...dirs[e.key]);}
});
function startBattle(base,boss){
enemy={...base,hp:base.hp,maxHp:base.hp};
battleBoss=boss;defending=false;busy=false;
showView("battle");
$("enemyInfo").textContent=(boss?"👑 BOSS ":"")+enemy.name+" HP "+enemy.hp+"/"+enemy.maxHp;
$("battleLog").textContent=enemy.name+"が現れた！";
showEnemy();
refresh();
}
function showEnemy(){
const img=$("enemyImage"),fallback=$("enemyFallback");
img.style.display="none";fallback.style.display="none";
if(enemy.img){
img.onload=()=>{img.style.display="block";fallback.style.display="none";};
img.onerror=()=>{img.style.display="none";fallback.style.display="block";drawFallback();};
img.src=enemy.img;
}else{
fallback.style.display="block";drawFallback();
}
}
function drawFallback(){
const c=$("enemyFallback"),g=c.getContext("2d");
g.clearRect(0,0,128,128);g.imageSmoothingEnabled=false;
const color={
slime:"#2d9eff",goblin:"#4ea447",dragon:"#d44532",
zombie:"#7eae83",scorpion:"#c88b35",
soldier:"#a6b6ce",demon:"#9545c9",golem:"#998a72"
}[enemy.type]||"#c75a5a";
g.fillStyle="#15151e";
g.fillRect(18,105,92,8);
g.fillStyle=color;
if(enemy.type==="slime"){
g.fillRect(35,65,58,36);g.fillRect(43,49,42,20);g.fillRect(59,39,12,13);
}else{
g.fillRect(42,43,44,50);g.fillRect(48,20,32,29);
g.fillRect(25,51,18,38);g.fillRect(85,51,18,38);
g.fillRect(45,90,15,20);g.fillRect(70,90,15,20);
if(enemy.type==="dragon"||enemy.type==="demon"){
g.fillRect(10,35,34,35);g.fillRect(84,35,34,35);
g.fillRect(48,8,10,16);g.fillRect(71,8,10,16);
}
}
g.fillStyle="#fff";
g.fillRect(52,52,7,7);g.fillRect(71,52,7,7);
g.fillStyle="#101020";
g.fillRect(55,54,3,3);g.fillRect(74,54,3,3);
}
function log(t){
$("battleLog").textContent=t;
$("enemyInfo").textContent=(battleBoss?"👑 BOSS ":"")+enemy.name+" HP "+enemy.hp+"/"+enemy.maxHp;
refresh();
}
function damage(a,d){
return Math.max(1,Math.floor(a-d/2+rand(-2,2)));
}
function attack(){
if(!enemy||busy)return;
playerAction(damage(totalAtk(),enemy.def),"攻撃");
}
function defend(){
if(!enemy||busy)return;
defending=true;log("勇者は身を守った！");
enemyTurn();
}
function playerAction(amount,label){
if(!enemy||busy)return;
enemy.hp=Math.max(0,enemy.hp-amount);
log(label+"！ "+enemy.name+"に"+amount+"ダメージ！");
if(enemy.hp<=0){winBattle();return;}
enemyTurn();
}
function enemyTurn(){
busy=true;
setTimeout(()=>{
if(!enemy){busy=false;return;}
const d=damage(enemy.atk,totalDef());
const actual=defending?Math.max(1,Math.floor(d/2)):d;
player.hp=Math.max(0,player.hp-actual);
defending=false;
log(enemy.name+"の攻撃！ "+actual+"ダメージ！");
busy=false;
if(player.hp<=0)loseBattle();
},550);
}
function winBattle(){
const e=enemy;
player.xp+=e.xp;player.gold+=e.gold;
let text=e.name+"を倒した！ EXP+"+e.xp+" / "+e.gold+"G";
while(player.xp>=player.lv*20){
player.xp-=player.lv*20;player.lv++;
player.maxHp+=rand(7,11);player.maxMp+=rand(3,5);
player.atk+=rand(2,4);player.def+=rand(1,3);
player.hp=player.maxHp;player.mp=player.maxMp;
text+=" LV"+player.lv+"にアップ！";
const learned=skills.filter(s=>s.lv===player.lv);
learned.forEach(s=>text+=" "+s.name+"を習得！");
}
if(battleBoss){
player.cleared[player.area]=true;
if(player.area===2){gameWon=true;text+=" 魔王を倒し世界に平和が戻った！";}
else{text+=" 次のエリアへの扉が開いた！";}
}
enemy=null;showView("field");msg(text);drawMap();refresh();
}
function loseBattle(){
enemy=null;player.gold=Math.floor(player.gold/2);
player.hp=player.maxHp;player.mp=player.maxMp;
player.x=1;player.y=8;
showView("field");msg("力尽きた… 所持金が半分になった。");drawMap();refresh();
}
function escapeBattle(){
if(!enemy||busy)return;
if(battleBoss){log("ボスからは逃げられない！");enemyTurn();return;}
if(Math.random()<0.7){
enemy=null;showView("field");msg("うまく逃げ切った！");
drawMap();refresh();
}else{log("逃げられなかった！");enemyTurn();}
}
function openMagic(){
if(!enemy||busy)return;
const learned=skills.filter(s=>player.lv>=s.lv);
panel("魔法・特技",learned.length?learned.map(s=>({
text:s.name+" MP"+s.mp,
fn:()=>{
if(player.mp<s.mp){alert("MPが足りない！");return;}
player.mp-=s.mp;closePanel();
const amount=s.kind==="skill"?
Math.max(1,Math.floor(damage(totalAtk(),enemy.def)*s.mult)):
rand(s.min,s.max);
playerAction(amount,s.name);
}
})):["まだ技を覚えていない。"]);
}
function useItem(kind){
if(player.items[kind]<=0)return;
if(kind==="herb"){
if(player.hp>=player.maxHp){alert("HPは満タン！");return;}
player.items.herb--;
player.hp=Math.min(player.maxHp,player.hp+35);
}else{
if(player.mp>=player.maxMp){alert("MPは満タン！");return;}
player.items.water--;
player.mp=Math.min(player.maxMp,player.mp+15);
}
closePanel();refresh();
if(enemy){log(kind==="herb"?"薬草でHP回復！":"聖水でMP回復！");enemyTurn();}
else msg(kind==="herb"?"薬草を使った！":"聖水を使った！");
}
function openItems(){
if(busy)return;
panel("道具",[
{text:"🌿 薬草 ×"+player.items.herb+"（HP35回復）",fn:()=>useItem("herb")},
{text:"💧 聖水 ×"+player.items.water+"（MP15回復）",fn:()=>useItem("water")}
]);
}
function openShop(){
if(enemy)return;
const options=["お店へようこそ！ 所持金 "+player.gold+"G"];
tiers.forEach((t,i)=>{
[["sword","剣",t.atk],["shield","盾",t.shield],["armor","鎧",t.armor]].forEach(([type,label,bonus])=>{
const key=type+i;
options.push({
text:t.name+"の"+label+" +"+bonus+" / "+t.price+"G"+(player.owned.includes(key)?"（購入済）":""),
fn:()=>{
if(player.owned.includes(key)){alert("購入済み！");return;}
if(player.gold<t.price){alert("ゴールドが足りない！");return;}
player.gold-=t.price;player.owned.push(key);
player.equipment[type]=i;refresh();openShop();
}
});
});
});
options.push({text:"薬草 20G",fn:()=>buyItem("herb",20)});
options.push({text:"聖水 25G",fn:()=>buyItem("water",25)});
panel("🏪 お店",options);
}
function buyItem(kind,cost){
if(player.gold<cost){alert("ゴールドが足りない！");return;}
player.gold-=cost;player.items[kind]++;
refresh();openShop();
}
function openEquipment(){
const options=[];
[["sword","剣"],["shield","盾"],["armor","鎧"]].forEach(([type,label])=>{
options.push(label+"："+
(player.equipment[type]<0?"なし":tiers[player.equipment[type]].name+"の"+label));
tiers.forEach((t,i)=>{
if(player.owned.includes(type+i))options.push({
text:t.name+"の"+label+"を装備",
fn:()=>{player.equipment[type]=i;refresh();openEquipment();}
});
});
});
panel("装備",options);
}
function openStatus(){
panel("勇者のステータス",[
"レベル "+player.lv,
"経験値 "+player.xp+" / "+player.lv*20,
"HP "+player.hp+" / "+player.maxHp,
"MP "+player.mp+" / "+player.maxMp,
"攻撃力 "+totalAtk(),
"守備力 "+totalDef(),
"ゴールド "+player.gold+"G",
"現在地 "+names[player.area],
