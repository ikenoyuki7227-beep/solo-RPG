function fitMap(){const w=$('world');if(w.style.display==='none')return;const m=$('map');const other=[...w.children].filter(el=>el!==m).reduce((a,el)=>a+el.getBoundingClientRect().height,0);const gap=5*3;const available=w.clientHeight-other-gap;const size=Math.max(80,Math.min(w.clientWidth,available));m.style.width=size+'px';m.style.height=size+'px';m.style.flex='none'}window.addEventListener('resize',()=>requestAnimationFrame(fitMap));function tile(x,y){let seed=(x*83+y*197+x*y*17)%23;return seed}function draw(){ctx.fillStyle=areas[p.area].color;ctx.fillRect(0,0,384,384);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let s=tile(x,y),px=x*T,py=y*T;if(x===0||y===0||x===15||y===15){ctx.fillStyle=areas[p.area].edge;ctx.fillRect(px,py,T,T);continue}if(s<5){ctx.fillStyle=p.area===0?'#367e37':p.area===1?'#b69a5b':'#523768';ctx.fillRect(px+7,py+8,8,9);ctx.fillRect(px+10,py+4,3,14)}else if(s===8){ctx.fillStyle=p.area===0?'#a5d57a':p.area===1?'#f3d997':'#a66cc2';ctx.fillRect(px+4,py+15,9,3)}}let bx=13*T,by=3*T;ctx.fillStyle='#231c34';ctx.fillRect(bx,by,24,24);ctx.fillStyle=['#df4545','#989999','#a32ce2'][p.area];ctx.fillRect(bx+4,by+3,16,17);ctx.fillStyle='#fff';ctx.fillRect(bx+6,by+8,4,4);ctx.fillRect(bx+14,by+8,4,4);ctx.fillStyle='#f8db6c';ctx.fillRect(3*T,3*T,24,24);ctx.fillStyle='#8a5b31';ctx.fillRect(3*T+5,3*T+5,14,14);ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.fillText('店',3*T+5,3*T+17);let px=p.x*T,py=p.y*T;ctx.fillStyle='#142a6b';ctx.fillRect(px+6,py+12,12,10);ctx.fillStyle='#f3c28d';ctx.fillRect(px+7,py+5,10,10);ctx.fillStyle='#3d55d0';ctx.fillRect(px+5,py+3,14,5);ctx.fillStyle='#eee';ctx.fillRect(px+8,py+9,3,2);ctx.fillRect(px+14,py+9,3,2);stats();requestAnimationFrame(fitMap)}
function move(dx,dy){if(foe||$('shop').style.display!=='none')return;let x=p.x+dx,y=p.y+dy;if(x<1||x>14||y<1||y>14)return;p.x=x;p.y=y;draw();save();if(x===3&&y===3){openShop();return}if(x===13&&y===3){startBattle(areas[p.area].boss,true);return}steps++;if(steps>2&&Math.random()<.17){steps=0;startBattle(areas[p.area].enemies[rand(0,1)],false)}}
function startBattle(name,boss){let e=enemies[name];foe={name,hp:e[0],maxhp:e[0],atk:e[1],def:e[2],xp:e[3],gold:e[4],boss};guard=false;busy=false;$('world').style.display='none';$('battle').style.display='flex';$('menu').style.display='none';$('acts').style.display='grid';$('log').textContent=`${name} が現れた！`;drawEnemy();stats()}
function drawEnemy(){let c=$('enemy').getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#171329';c.fillRect(0,0,384,220);if(!foe)return;if(enemyImages[foe.name]){let im=enemyImages[foe.name];if(im.complete&&im.naturalWidth){let scale=Math.min(340/im.width,190/im.height);let ww=im.width*scale,hh=im.height*scale;c.drawImage(im,(384-ww)/2,(220-hh)/2,ww,hh);}else im.onload=()=>{if(foe)drawEnemy()};$('foe').textContent=`${foe.name}　HP ${Math.max(0,foe.hp)}/${foe.maxhp}`;return;}let colors={'スライム':'#59b6ed','ゴブリン':'#69a64a','ゾンビ':'#9d9a82','さそり':'#c57c2c','兵士':'#9aaed2','悪魔':'#aa4ac4','ドラゴン':'#df4244','ゴーレム':'#ad9e8c','魔王':'#8b42b7'};let col=colors[foe.name];c.fillStyle=col;let big=foe.boss?8:6;let pattern=['000011110000','000111111000','001111111100','011111111110','111011110111','111111111111','011111111110','001111111100','001101101100','011001100110','110001100011'];for(let y=0;y<pattern.length;y++)for(let x=0;x<12;x++)if(pattern[y][x]==='1')c.fillRect(192-6*big+x*big,35+y*big,big,big);c.fillStyle='#fff';c.fillRect(192-3*big,35+4*big,big,big);c.fillRect(192+2*big,35+4*big,big,big);c.fillStyle='#181818';c.fillRect(192-3*big+2,35+4*big+2,big-3,big-3);c.fillRect(192+2*big+2,35+4*big+2,big-3,big-3);$('foe').textContent=`${foe.name}　HP ${Math.max(0,foe.hp)}/${foe.maxhp}`}
function log(t){$('log').textContent=t;drawEnemy();stats();save()}function damage(n,txt){if(!foe||busy)return;busy=true;foe.hp=Math.max(0,foe.hp-n);log(`${txt} ${n}ダメージ！`);if(foe.hp===0){let e=foe;foe=null;p.xp+=e.xp;p.gold+=e.gold;let t=`${e.name}を倒した！ EXP ${e.xp}、${e.gold}G 獲得。`;while(p.xp>=p.lv*22){p.xp-=p.lv*22;p.lv++;p.maxhp+=rand(7,11);p.maxmp+=rand(3,5);p.atk+=rand(2,4);p.def+=rand(1,3);p.hp=p.maxhp;p.mp=p.maxmp;t+=` レベル${p.lv}に上がった！`}if(e.boss){p.wins.push(e.name);if(p.area<2){p.area++;p.x=2;p.y=12;p.hp=p.maxhp;p.mp=p.maxmp;t+=` ${areas[p.area].name}へ進んだ！`}else t+=' 魔王を倒した！世界に平和が戻った！'}$('battle').style.display='none';$('world').style.display='flex';busy=false;msg(t);draw();save();return}setTimeout(enemyTurn,550)}function enemyTurn(){if(!foe)return;let d=stats()[1],n=Math.max(1,foe.atk+rand(-3,3)-Math.floor(d*.65));if(guard)n=Math.max(1,Math.floor(n/2));p.hp=Math.max(0,p.hp-n);guard=false;busy=false;log(`${foe.name}の攻撃！ ${n}ダメージを受けた。`);if(p.hp===0){alert('力尽きた！ HP・MPを回復して草原から再開します。');foe=null;p.hp=p.maxhp;p.mp=p.maxmp;p.area=0;p.x=2;p.y=12;p.gold=Math.max(0,p.gold-20);$('battle').style.display='none';$('world').style.display='flex';msg('再び冒険に出発しよう！');draw();save()}}function attack(){damage(Math.max(1,stats()[0]+rand(-2,3)-Math.floor(foe.def*.5)),'攻撃！')}function defend(){if(!foe||busy)return;guard=true;busy=true;log('身を守った！');setTimeout(enemyTurn,500)}function spellMenu(){if(!foe||busy)return;let skills=[['チカラ切り',3,1,1.5],['渾身切り',6,3,2],['本気切り',10,5,3]],spells=[['火炎弾',2,2,10,20],['爆炎弾',5,5,25,50],['豪炎弾',8,10,50,80]];let html='<b>特技・魔法</b><div class="actions">';for(let [name,lv,mp,mul] of skills)if(p.lv>=lv)html+=`<button onclick="cast('${name}',${mp},${mul},0,0)">${name} MP${mp}</button>`;for(let [name,lv,mp,min,max] of spells)if(p.lv>=lv)html+=`<button onclick="cast('${name}',${mp},0,${min},${max})">${name} MP${mp}</button>`;html+='</div><button onclick="closeMenu()">戻る</button>';$('menu').innerHTML=html;$('menu').style.display='flex'}function closeMenu(){$('menu').style.display='none'}function cast(name,cost,mul,min,max){if(p.mp<cost){log('MPが足りない！');return}p.mp-=cost;closeMenu();damage(mul?Math.max(1,Math.floor(stats()[0]*mul)-Math.floor(foe.def*.5)):rand(min,max),name+'！')}function run(){if(!foe||busy)return;if(foe.boss){log('ボスからは逃げられない！');return}if(Math.random()<.7){foe=null;$('battle').style.display='none';$('world').style.display='flex';msg('うまく逃げ切った！');draw()}else{busy=true;log('逃げられなかった！');setTimeout(enemyTurn,500)}}function useItem(type){if(busy)return;let isHerb=type==='herb',key=isHerb?'herb':'water',name=isHerb?'薬草':'聖水',max=isHerb?'maxhp':'maxmp',stat=isHerb?'hp':'mp',amt=isHerb?35:15;if(p[key]<=0){if(foe)log(`${name}がない！`);else msg(`${name}がない！`);return}if(p[stat]>=p[max]){if(foe)log('すでに満タン！');else msg('すでに満タン！');return}p[key]--;let gain=Math.min(amt,p[max]-p[stat]);p[stat]+=gain;if(foe){busy=true;log(`${name}を使って${gain}回復！`);setTimeout(enemyTurn,500)}else{msg(`${name}を使って${gain}回復！`);draw()}save()}
function openShop(){if(foe)return;$('shop').style.display='flex';$('world').style.display='none';renderShop()}function renderShop(){let html=`<h3>道具屋・武具屋　所持金 ${p.gold}G</h3><p>薬草 ${p.herb}個 / 聖水 ${p.water}個</p><div class="actions"><button onclick="buyItem('herb',12)">薬草 12G</button><button onclick="buyItem('water',20)">聖水 20G</button>`;for(let key of ['sword','shield','armor'])for(let i=0;i<3;i++){let [name,cost]=gear[key][i];html+=`<button onclick="buyGear('${key}',${i})">${name} ${cost}G${p[key]===i?' ✓':''}</button>`}html+='</div><p id="shopmsg"></p><button onclick="leaveShop()">店を出る</button>';$('shop').innerHTML=html}function buyItem(key,cost){if(p.gold<cost){$('shopmsg').textContent='ゴールドが足りない';return}p.gold-=cost;p[key]++;renderShop();save()}function buyGear(key,i){let [name,cost]=gear[key][i];if(p[key]>=i){$('shopmsg').textContent='すでに同等以上の装備を持っている';return}if(p.gold<cost){$('shopmsg').textContent='ゴールドが足りない';return}p.gold-=cost;p[key]=i;renderShop();save()}function leaveShop(){$('shop').style.display='none';$('world').style.display='flex';msg('冒険を続けよう！');draw()}
document.addEventListener('keydown',e=>{let dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(dirs[e.key]){e.preventDefault();move(...dirs[e.key])}});msg(`${areas[p.area].name}を探索しよう！ 右上がボス、左上が店。`);draw();
</script></html>
